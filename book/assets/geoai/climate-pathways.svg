<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Climate and health: connect the missing middle</title><desc id="desc">Climate and health: connect the missing middle | A hazard layer alone does not measure who becomes ill or loses access to care. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | HAZARD | Heat, flood, drought or | smoke: intensity, | duration and timing. | EXPOSURE | People, services and | livelihoods in the | affected place and | period. | VULNERABILITY | Sensitivity, housing, | livelihood constraints | and available protection. | Potential health / service consequences | Observed outcomes require health data and causal caution. | Capacity can change risk | Adaptation • access • continuity | A pathway diagram explains relationships; it is not a risk equation or calibrated model.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Climate and health: connect the missing middle</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">A hazard layer alone does not measure who becomes ill or loses access to care.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="150" width="350" height="230" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="150" width="6" height="230" rx="2" fill="#225caa" stroke="none"/><text x="62" y="187.0" font-size="24" font-weight="700" fill="#225caa">HAZARD</text><text x="62" y="252.0" font-size="22" font-weight="400" fill="#162b42">Heat, flood, drought or</text><text x="62" y="281.7" font-size="22" font-weight="400" fill="#162b42">smoke: intensity,</text><text x="62" y="311.4" font-size="22" font-weight="400" fill="#162b42">duration and timing.</text><rect x="420" y="150" width="350" height="230" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="150" width="6" height="230" rx="2" fill="#08776f" stroke="none"/><text x="442" y="187.0" font-size="24" font-weight="700" fill="#08776f">EXPOSURE</text><text x="442" y="252.0" font-size="22" font-weight="400" fill="#162b42">People, services and</text><text x="442" y="281.7" font-size="22" font-weight="400" fill="#162b42">livelihoods in the</text><text x="442" y="311.4" font-size="22" font-weight="400" fill="#162b42">affected place and</text><text x="442" y="341.1" font-size="22" font-weight="400" fill="#162b42">period.</text><rect x="800" y="150" width="350" height="230" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="150" width="6" height="230" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="187.0" font-size="24" font-weight="700" fill="#7447a5">VULNERABILITY</text><text x="822" y="252.0" font-size="22" font-weight="400" fill="#162b42">Sensitivity, housing,</text><text x="822" y="281.7" font-size="22" font-weight="400" fill="#162b42">livelihood constraints</text><text x="822" y="311.4" font-size="22" font-weight="400" fill="#162b42">and available protection.</text><path d="M215 385 L215 435" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M595 385 L595 435" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M975 385 L975 435" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="450" width="710" height="110" rx="14" fill="#fff3d9" stroke="none"/><text x="60" y="487.0" font-size="25" font-weight="700" fill="#995b0c">Potential health / service consequences</text><text x="60" y="527.0" font-size="22" font-weight="400" fill="#162b42">Observed outcomes require health data and causal caution.</text><rect x="775" y="450" width="385" height="110" rx="14" fill="#e5f5f0" stroke="none"/><text x="795" y="487.0" font-size="24" font-weight="700" fill="#08776f">Capacity can change risk</text><text x="795" y="527.0" font-size="21" font-weight="400" fill="#162b42">Adaptation • access • continuity</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">A pathway diagram explains relationships; it is not a risk equation or calibrated model.</text></svg>
