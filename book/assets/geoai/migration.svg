<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Climate, mobility and conflict: resist a single-cause story</title><desc id="desc">Climate, mobility and conflict: resist a single-cause story | The useful health question is how services can remain accessible and trusted. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Climate pressure | Flood, drought, heat, | livelihood disruption. | Other major drivers | Institutions, income, | safety, social ties and | policy. | Community choices | Adapt, stay, move | temporarily or relocate; | some cannot move. | Plan inclusive service continuity under several scenarios | Do not profile migrants or portray movement as a security threat. | Climate, migration and conflict are context-dependent; no single map establishes causation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Climate, mobility and conflict: resist a single-cause story</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">The useful health question is how services can remain accessible and trusted.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="150" width="350" height="240" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="150" width="6" height="240" rx="2" fill="#225caa" stroke="none"/><text x="62" y="187.0" font-size="24" font-weight="700" fill="#225caa">Climate pressure</text><text x="62" y="252.0" font-size="22" font-weight="400" fill="#162b42">Flood, drought, heat,</text><text x="62" y="281.7" font-size="22" font-weight="400" fill="#162b42">livelihood disruption.</text><rect x="420" y="150" width="350" height="240" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="150" width="6" height="240" rx="2" fill="#08776f" stroke="none"/><text x="442" y="187.0" font-size="24" font-weight="700" fill="#08776f">Other major drivers</text><text x="442" y="252.0" font-size="22" font-weight="400" fill="#162b42">Institutions, income,</text><text x="442" y="281.7" font-size="22" font-weight="400" fill="#162b42">safety, social ties and</text><text x="442" y="311.4" font-size="22" font-weight="400" fill="#162b42">policy.</text><rect x="800" y="150" width="350" height="240" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="150" width="6" height="240" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="187.0" font-size="24" font-weight="700" fill="#7447a5">Community choices</text><text x="822" y="252.0" font-size="22" font-weight="400" fill="#162b42">Adapt, stay, move</text><text x="822" y="281.7" font-size="22" font-weight="400" fill="#162b42">temporarily or relocate;</text><text x="822" y="311.4" font-size="22" font-weight="400" fill="#162b42">some cannot move.</text><path d="M200 400 L440 465" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M600 400 L600 465" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M990 400 L760 465" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="190" y="475" width="820" height="95" rx="14" fill="#fff3d9" stroke="none"/><text x="215" y="510.0" font-size="24" font-weight="700" fill="#995b0c">Plan inclusive service continuity under several scenarios</text><text x="215" y="547.0" font-size="22" font-weight="400" fill="#162b42">Do not profile migrants or portray movement as a security threat.</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Climate, migration and conflict are context-dependent; no single map establishes causation.</text></svg>
