<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Polio: turn coverage gaps into checked microplans</title><desc id="desc">Polio: turn coverage gaps into checked microplans | Existing GIS practice can inform a carefully validated GeoAI extension. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Map the denominator | Settlements, eligible | children estimates, team | areas and difficult | routes. Mark uncertain or | missing places. | 1 | Verify locally | Imagery may suggest | unmapped buildings. Field | teams confirm habitation, | names, access and | eligibility. | 2 | Plan and evaluate | Allocate visits and | logistics with local | teams. Check missed | settlements and | independent coverage | evidence. | 3 | Detected rooftops are not counts of children, households or vaccination status.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Polio: turn coverage gaps into checked microplans</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Existing GIS practice can inform a carefully validated GeoAI extension.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="180" width="350" height="350" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="180" width="6" height="350" rx="2" fill="#225caa" stroke="none"/><text x="62" y="217.0" font-size="24" font-weight="700" fill="#225caa">Map the denominator</text><text x="62" y="282.0" font-size="22" font-weight="400" fill="#162b42">Settlements, eligible</text><text x="62" y="311.7" font-size="22" font-weight="400" fill="#162b42">children estimates, team</text><text x="62" y="341.4" font-size="22" font-weight="400" fill="#162b42">areas and difficult</text><text x="62" y="371.1" font-size="22" font-weight="400" fill="#162b42">routes. Mark uncertain or</text><text x="62" y="400.8" font-size="22" font-weight="400" fill="#162b42">missing places.</text><circle cx="70" cy="570" r="15" fill="#225caa"/><text x="63" y="577.0" font-size="20" font-weight="700" fill="white">1</text><path d="M391 350 L415 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="180" width="350" height="350" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="180" width="6" height="350" rx="2" fill="#08776f" stroke="none"/><text x="442" y="217.0" font-size="24" font-weight="700" fill="#08776f">Verify locally</text><text x="442" y="282.0" font-size="22" font-weight="400" fill="#162b42">Imagery may suggest</text><text x="442" y="311.7" font-size="22" font-weight="400" fill="#162b42">unmapped buildings. Field</text><text x="442" y="341.4" font-size="22" font-weight="400" fill="#162b42">teams confirm habitation,</text><text x="442" y="371.1" font-size="22" font-weight="400" fill="#162b42">names, access and</text><text x="442" y="400.8" font-size="22" font-weight="400" fill="#162b42">eligibility.</text><circle cx="450" cy="570" r="15" fill="#08776f"/><text x="443" y="577.0" font-size="20" font-weight="700" fill="white">2</text><path d="M771 350 L795 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="350" height="350" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="180" width="6" height="350" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="217.0" font-size="24" font-weight="700" fill="#7447a5">Plan and evaluate</text><text x="822" y="282.0" font-size="