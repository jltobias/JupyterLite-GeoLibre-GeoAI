<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">From geographic question to accountable action</title><desc id="desc">From geographic question to accountable action | The notebooks teach parts of this workflow; they are not deployed clinical systems. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | 01 QUESTION | Choose a decision and an | accountable owner. | 02 DATA | Check permission, date, | units and missingness. | 03 FEATURES | Join geography; align | time and spatial scale. | 04 MODEL | Compare a simple baseline | with learned patterns. | 05 VALIDATE | Hold out places / time; | map errors and | uncertainty. | 06 ACT + LEARN | Human review, measured | benefit and monitoring. | A model output becomes useful only when a real decision can be checked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">From geographic question to accountable action</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">The notebooks teach parts of this workflow; they are not deployed clinical systems.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="155" width="350" height="180" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="155" width="6" height="180" rx="2" fill="#225caa" stroke="none"/><text x="62" y="192.0" font-size="24" font-weight="700" fill="#225caa">01 QUESTION</text><text x="62" y="257.0" font-size="22" font-weight="400" fill="#162b42">Choose a decision and an</text><text x="62" y="286.7" font-size="22" font-weight="400" fill="#162b42">accountable owner.</text><path d="M392 245 L415 245" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="155" width="350" height="180" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="155" width="6" height="180" rx="2" fill="#08776f" stroke="none"/><text x="442" y="192.0" font-size="24" font-weight="700" fill="#08776f">02 DATA</text><text x="442" y="257.0" font-size="22" font-weight="400" fill="#162b42">Check permission, date,</text><text x="442" y="286.7" font-size="22" font-weight="400" fill="#162b42">units and missingness.</text><path d="M772 245 L795 245" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="155" width="350" height="180" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="155" width="6" height="180" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="192.0" font-size="24" font-weight="700" fill="#7447a5">03 FEATURES</text><text x="822" y="257.0" font-size="22" font-weight="400" fill="#162b42">Join geography; align</text><text x="822" y="286.7" font-size="22" font-weight="400" fill="#162b42">time and spatial scale.</text><rect x="40" y="360" width="350" height="180" rx="14" fill="#fff3d9" stroke="none"/><rect x="40" y="360" width="6" height="180" rx="2" fill="#995b0c" stroke="none"/><text x="62" y="397.0" font-size="24" font-weight="700" fill="#995b0c">04 MODEL</text><text x="62" y="462.0" font-size="22" font-weight="400" fill="#162b42">Compare a simple baseline</text><text x="62" y="491.7" font-size="22" font-weight="400" fill="#162b42">with learned patterns.</text><path d="M392 450 L415 450" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="360" width="350" height="180" rx="14" fill="#eaf2fd" stroke="none"/><rect x="420" y="360" width="6" height="180" rx="2" fill="#225caa" stroke="none"/><text x="442" y="397.0" font-size="24" font-weight="700" fill="#225caa">05 VALIDATE</text><text x="442" y="462.0" font-size="22" font-weight="400" fill="#162b42">Hold out places / time;</text><text x="442" y="491.7" font-size="22" font-weight="400" fill="#162b42">map errors and</text><text x="442" y="521.4" font-size="22" font-weight="400" fill="#162b42">uncertainty.</text><path d="M772 450 L795 450" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="360" width="350" height="180" rx="14" fill="#e5f5f0" stroke="none"/><rect x="800" y="360" width="6" height="180" rx="2" fill="#08776f" stroke="none"/><text x="822" y="397.0" font-size="24" font-weight="700" fill="#08776f">06 ACT + LEARN</text><text x="822" y="462.0" font-size="22" font-weight="400" fill="#162b42">Human review, measured</text><text x="822" y="491.7" font-size="22" font-weight="400" fill="#162b42">benefit and monitoring.</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">A model output becomes useful only when a real decision can be checked.</text></svg>
