<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Ebola: support verified response work</title><desc id="desc">Ebola: support verified response work | Geography helps organize a response; it does not identify infection from space. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Verified evidence | Authorized surveillance, | confirmed service | locations and documented | investigations. Protect | access. | 1 | Operational geography | Route teams and samples; | inspect reporting delays | and facility access. | Separate verified from | unverified alerts. | 2 | Human investigation | Trained teams verify | contacts and alerts. | Review faster response | against false alarms, | harm and workload. | 3 | Sister-city links, roads and nearby homes are not evidence of person-to-person contact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Ebola: support verified response work</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Geography helps organize a response; it does not identify infection from space.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="180" width="350" height="350" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="180" width="6" height="350" rx="2" fill="#225caa" stroke="none"/><text x="62" y="217.0" font-size="24" font-weight="700" fill="#225caa">Verified evidence</text><text x="62" y="282.0" font-size="22" font-weight="400" fill="#162b42">Authorized surveillance,</text><text x="62" y="311.7" font-size="22" font-weight="400" fill="#162b42">confirmed service</text><text x="62" y="341.4" font-size="22" font-weight="400" fill="#162b42">locations and documented</text><text x="62" y="371.1" font-size="22" font-weight="400" fill="#162b42">investigations. Protect</text><text x="62" y="400.8" font-size="22" font-weight="400" fill="#162b42">access.</text><circle cx="70" cy="570" r="15" fill="#225caa"/><text x="63" y="577.0" font-size="20" font-weight="700" fill="white">1</text><path d="M391 350 L415 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="180" width="350" height="350" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="180" width="6" height="350" rx="2" fill="#08776f" stroke="none"/><text x="442" y="217.0" font-size="24" font-weight="700" fill="#08776f">Operational geography</text><text x="442" y="282.0" font-size="22" font-weight="400" fill="#162b42">Route teams and samples;</text><text x="442" y="311.7" font-size="22" font-weight="400" fill="#162b42">inspect reporting delays</text><text x="442" y="341.4" font-size="22" font-weight="400" fill="#162b42">and facility access.</text><text x="442" y="371.1" font-size="22" font-weight="400" fill="#162b42">Separate verified from</text><text x="442" y="400.8" font-size="22" font-weight="400" fill="#162b42">unverified alerts.</text><circle cx="450" cy="570" r="15" fill="#08776f"/><text x="443" y="577.0" font-size="20" font-weight="700" fill="white">2</text><path d="M771 350 L795 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="350" height="350" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="180" width="6" height="350" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="217.0" font-size="24" font-weight="700" fill="#7447a5">Human investigation</text><text x="822" y="282.0" font-size="22" font-weight="400" fill="#162b42">Trained teams verify</text><text x="822" y="311.7" font-size="22" font-weight="400" fill="#162b42">contacts and alerts.</text><text x="822" y="341.4" font-size="22" font-weight="400" fill="#162b42">Review faster response</text><text x="822" y="371.1" font-size="22" font-weight="400" fill="#162b42">against false alarms,</text><text x="822" y="400.8" font-size="22" font-weight="400" fill="#162b42">harm and workload.</text><circle cx="830" cy="570" r="15" fill="#7447a5"/><text x="823" y="577.0" font-size="20" font-weight="700" fill="white">3</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Sister-city links, roads and nearby homes are not evidence of person-to-person contact.</text></svg>
