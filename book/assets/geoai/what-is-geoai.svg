<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">What makes AI geographic?</title><desc id="desc">What makes AI geographic? | The same learning algorithms can answer very different questions when place matters. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | AI: methods for learning, reasoning and assistance | GeoAI: AI with geographic context | Location • distance • neighbors • networks | Scale • time • imagery • spatial uncertainty | Not just an AI answer displayed on a map. | GIS contribution | Coordinates, spatial joins, | layers and geographic | reasoning. | Domain contribution | Health expertise, community | knowledge, governance and | decisions. | GeoAI is a specialization of AI, not an unrelated replacement for it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">What makes AI geographic?</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">The same learning algorithms can answer very different questions when place matters.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="155" width="700" height="410" rx="14" fill="#eaf2fd" stroke="#225caa"/><text x="65" y="200.0" font-size="25" font-weight="700" fill="#225caa">AI: methods for learning, reasoning and assistance</text><rect x="90" y="245" width="595" height="265" rx="14" fill="#e5f5f0" stroke="#08776f"/><text x="115" y="285.0" font-size="27" font-weight="700" fill="#08776f">GeoAI: AI with geographic context</text><text x="115" y="335.0" font-size="23" font-weight="400" fill="#162b42">Location • distance • neighbors • networks</text><text x="115" y="377.0" font-size="23" font-weight="400" fill="#162b42">Scale • time • imagery • spatial uncertainty</text><text x="115" y="446.0" font-size="23" font-weight="700" fill="#08776f">Not just an AI answer displayed on a map.</text><rect x="775" y="155" width="385" height="190" rx="14" fill="#e5f5f0" stroke="none"/><rect x="775" y="155" width="6" height="190" rx="2" fill="#08776f" stroke="none"/><text x="797" y="192.0" font-size="24" font-weight="700" fill="#08776f">GIS contribution</text><text x="797" y="257.0" font-size="22" font-weight="400" fill="#162b42">Coordinates, spatial joins,</text><text x="797" y="286.7" font-size="22" font-weight="400" fill="#162b42">layers and geographic</text><text x="797" y="316.4" font-size="22" font-weight="400" fill="#162b42">reasoning.</text><rect x="775" y="365" width="385" height="200" rx="14" fill="#f1eafa" stroke="none"/><rect x="775" y="365" width="6" height="200" rx="2" fill="#7447a5" stroke="none"/><text x="797" y="402.0" font-size="24" font-weight="700" fill="#7447a5">Domain contribution</text><text x="797" y="467.0" font-size="22" font-weight="400" fill="#162b42">Health expertise, community</text><text x="797" y="496.7" font-size="22" font-weight="400" fill="#162b42">knowledge, governance and</text><text x="797" y="526.4" font-size="22" font-weight="400" fill="#162b42">decisions.</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">GeoAI is a specialization of AI, not an unrelated replacement for it.</text></svg>
