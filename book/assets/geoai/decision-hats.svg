<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Rewiring global health: improve the decision loop</title><desc id="desc">Rewiring global health: improve the decision loop | Use the user&#x27;s Six Thinking Hats graphic as a prompt for multiple perspectives. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | WHITE | Evidence + gaps | RED | Concerns + trust | BLACK | Failure + harm | YELLOW | Potential benefit | GREEN | Alternatives | BLUE | Owner + next step | PURPLE SYNTHESIS — the supplied graphic&#x27;s extension | Combine evidence, dissent and trade-offs; choose an accountable, testable next step. | A human review framework, not seven autonomous AI agents or a validation substitute.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Rewiring global health: improve the decision loop</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Use the user&#x27;s Six Thinking Hats graphic as a prompt for multiple perspectives.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="155" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="193.0" font-size="23" font-weight="700" fill="#225caa">WHITE</text><text x="60" y="234.0" font-size="22" font-weight="400" fill="#162b42">Evidence + gaps</text><rect x="420" y="155" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="440" y="193.0" font-size="23" font-weight="700" fill="#ae2846">RED</text><text x="440" y="234.0" font-size="22" font-weight="400" fill="#162b42">Concerns + trust</text><rect x="800" y="155" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="820" y="193.0" font-size="23" font-weight="700" fill="#162b42">BLACK</text><text x="820" y="234.0" font-size="22" font-weight="400" fill="#162b42">Failure + harm</text><rect x="40" y="290" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="328.0" font-size="23" font-weight="700" fill="#995b0c">YELLOW</text><text x="60" y="369.0" font-size="22" font-weight="400" fill="#162b42">Potential benefit</text><rect x="420" y="290" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="440" y="328.0" font-size="23" font-weight="700" fill="#08776f">GREEN</text><text x="440" y="369.0" font-size="22" font-weight="400" fill="#162b42">Alternatives</text><rect x="800" y="290" width="350" height="110" rx="14" fill="#edf2f6" stroke="none"/><text x="820" y="328.0" font-size="23" font-weight="700" fill="#225caa">BLUE</text><text x="820" y="369.0" font-size="22" font-weight="400" fill="#162b42">Owner + next step</text><rect x="40" y="455" width="1120" height="110" rx="14" fill="#f1eafa" stroke="none"/><text x="65" y="494.0" font-size="25" font-weight="700" fill="#7447a5">PURPLE SYNTHESIS — the supplied graphic&#x27;s extension</text><text x="65" y="535.0" font-size="22" font-weight="400" fill="#162b42">Combine evidence, dissent and trade-offs; choose an accountable, testable next step.</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">A human review framework, not seven autonomous AI agents or a validation substitute.</text></svg>
