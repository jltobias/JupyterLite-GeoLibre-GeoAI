<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Vector shifts: suitability is one part of transmission</title><desc id="desc">Vector shifts: suitability is one part of transmission | Explore changes in where surveillance may be useful, not who will be infected. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Environmental | suitability | Temperature, rain, | seasonality, habitat and | species-specific limits; | extreme conditions can | reduce suitability too. | 1 | Transmission | conditions | Vector presence + | pathogen introduction + | human exposure + immunity | + prevention and care. | 2 | Verified response | Use entomology and | surveillance to evaluate | changes. Test transfer | across regions, seasons | and species. | 3 | A future suitability map is conditional on its scenario and assumptions, not a case forecast.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Vector shifts: suitability is one part of transmission</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Explore changes in where surveillance may be useful, not who will be infected.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="180" width="350" height="350" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="180" width="6" height="350" rx="2" fill="#225caa" stroke="none"/><text x="62" y="217.0" font-size="24" font-weight="700" fill="#225caa">Environmental</text><text x="62" y="249.4" font-size="24" font-weight="700" fill="#225caa">suitability</text><text x="62" y="282.0" font-size="22" font-weight="400" fill="#162b42">Temperature, rain,</text><text x="62" y="311.7" font-size="22" font-weight="400" fill="#162b42">seasonality, habitat and</text><text x="62" y="341.4" font-size="22" font-weight="400" fill="#162b42">species-specific limits;</text><text x="62" y="371.1" font-size="22" font-weight="400" fill="#162b42">extreme conditions can</text><text x="62" y="400.8" font-size="22" font-weight="400" fill="#162b42">reduce suitability too.</text><circle cx="70" cy="570" r="15" fill="#225caa"/><text x="63" y="577.0" font-size="20" font-weight="700" fill="white">1</text><path d="M391 350 L415 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="180" width="350" height="350" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="180" width="6" height="350" rx="2" fill="#08776f" stroke="none"/><text x="442" y="217.0" font-size="24" font-weight="700" fill="#08776f">Transmission</text><text x="442" y="249.4" font-size="24" font-weight="700" fill="#08776f">conditions</text><text x="442" y="282.0" font-size="22" font-weight="400" fill="#162b42">Vector presence +</text><text x="442" y="311.7" font-size="22" font-weight="400" fill="#162b42">pathogen introduction +</text><text x="442" y="341.4" font-size="22" font-weight="400" fill="#162b42">human exposure + immunity</text><text x="442" y="371.1" font-size="22" font-weight="400" fill="#162b42">+ prevention and care.</text><circle cx="450" cy="570" r="15" fill="#08776f"/><text x="443" y="577.0" font-size="20" font-weight="700" fill="white">2</text><path d="M771 350 L795 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="350" height="350" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="180" width="6" height="350" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="217.0" font-size="24" font-weight="700" fill="#7447a5">Verified response</text><text x="822" y="282.0" font-size="22" font-weight="400" fill="#162b42">Use entomology and</text><text x="822" y="311.7" font-size="22" font-weight="400" fill="#162b42">surveillance to evaluate</text><text x="822" y="341.4" font-size="22" font-weight="400" fill="#162b42">changes. Test transfer</text><text x="822" y="371.1" font-size="22" font-weight="400" fill="#162b42">across regions, seasons</text><text x="822" y="400.8" font-size="22" font-weight="400" fill="#162b42">and species.</text><circle cx="830" cy="570" r="15" fill="#7447a5"/><text x="823" y="577.0" font-size="20" font-weight="700" fill="white">3</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">A future suitability map is conditional on its scenario and assumptions, not a case forecast.</text></svg>
