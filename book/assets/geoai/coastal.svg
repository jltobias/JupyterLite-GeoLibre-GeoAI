<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Sea-level rise: low land is not automatically flooded</title><desc id="desc">Sea-level rise: low land is not automatically flooded | Keep statistical cluster evidence separate from physical flood modeling. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Coastal cross-section (invented) | Water level | Low but separated | More than elevation | Vertical datum + tides + connectivity + | defenses + drainage + scenario date. | Read lab 16 correctly | Its 3D height is reported relative risk. | Its scenario animation is not simulated | water depth. | A DEM threshold can screen low land; a credible inundation study needs more evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Sea-level rise: low land is not automatically flooded</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Keep statistical cluster evidence separate from physical flood modeling.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="155" width="560" height="380" rx="14" fill="#eaf2fd" stroke="none"/><text x="60" y="196.0" font-size="25" font-weight="700" fill="#225caa">Coastal cross-section (invented)</text><path d="M55 480 L55 435 L190 435 L265 300 L330 405 L420 395 L555 270 L580 480 Z" fill="#c9dac0" stroke="#507a41" stroke-width="3"/><path d="M55 350 L237.22 350 L190 435 L5