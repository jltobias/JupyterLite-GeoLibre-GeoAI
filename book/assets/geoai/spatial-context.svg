<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Place changes the question</title><desc id="desc">Place changes the question | A coordinate pair cannot describe every barrier between a community and a service. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | A • Bridge open | H | C | H = home area; C = clinic (invented) | B • Bridge closed | H | C | H = home area; C = clinic (invented) | Same straight-line distance. Different travel route. Different access to care.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Place changes the question</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">A coordinate pair cannot describe every barrier between a community and a service.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="160" width="530" height="370" rx="14" fill="#eaf2fd" stroke="none"/><text x="60" y="200.0" font-size="26" font-weight="700" fill="#225caa">A • Bridge open</text><path d="M285 215 L285 475" stroke="#97c7e2" stroke-width="30" fill="none"/><circle cx="130" cy="340" r="24" fill="#08776f"/><text x="123" y="347.0" font-size="20" font-weight="700" fill="white">H</text><circle cx="440" cy="340" r="24" fill="#08776f"/><text x="433" y="347.0" font-size="20" font-weight="700" fill="white">C</text><path d="M154 340 L261 340" stroke="#08776f" stroke-width="5" fill="none"/><path d="M309 34