<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Where does the work happen?</title><desc id="desc">Where does the work happen? | The runtime boundary is also a privacy, cost and reproducibility boundary. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Your browser | JupyterLite runs Python | in WebAssembly. Small | tables, arrays and | scikit-learn models can | run here. Local work is | not automatically | uploaded. | External data / maps | STAC APIs, imagery, | basemaps and the GeoLibre | hosted viewer use network | services. CORS, | permissions and | availability still apply. | Optional server / GPU | Large training jobs and | optional model requests | run outside the default | lesson. Review what data | leaves the browser. Keep | keys off the public site. | Browser-native computation does not mean offline-only or automatically private.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Where does the work happen?</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">The runtime boundary is also a privacy, cost and reproducibility boundary.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="160" width="345" height="370" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="160" width="6" height="370" rx="2" fill="#225caa" stroke="none"/><text x="62" y="197.0" font-size="24" font-weight="700" fill="#225caa">Your browser</text><text x="62" y="262.0" font-size="22" font-weight="400" fill="#162b42">JupyterLite runs Python</text><text x="62" y="291.7" font-size="22" font-weight="400" fill="#162b42">in WebAssembly. Small</text><text x="62" y="321.4" font-size="22" font-weight="400" fill="#162b42">tables, arrays and</text><text x="62" y="351.1" font-size="22" font-weight="400" fill="#162b42">scikit-learn models can</text><text x="62" y="380.8" font-size="22" font-weight="400" fill="#162b42">run here. Local work is</text><text x="62" y="410.5" font-size="22" font-weight="400" fill="#162b42">not automatically</text><text x="62" y="440.2" font-size="22" font-weight="400" fill="#162b42">uploaded.</text><rect x="425" y="160" width="345" height="370" rx="14" fill="#e5f5f0" stroke="none"/><rect x="425" y="160" width="6" height="370" rx="2" fill="#08776f" stroke="none"/><text x="447" y="197.0" font-size="24" font-weight="700" fill="#08776f">External data / maps</text><text x="447" y="262.0" font-size="22" font-weight="400" fill="#162b42">STAC APIs, imagery,</text><text x="447" y="291.7" font-size="22" font-weight="400" fill="#162b42">basemaps and the GeoLibre</text><text x="447" y="321.4" font-size="22" font-weight="400" fill="#162b42">hosted viewer use network</text><text x="447" y="351.1" font-size="22" font-weight="400" fill="#162b42">services. CORS,</text><text x="447" y="380.8" font-size="22" font-weight="400" fill="#162b42">permissions and</text><text x="447" y="410.5" font-size="22" font-weight="400" fill="#162b42">availability still apply.</text><rect x="810" y="160" width="350" height="370" rx="14" fill="#f1eafa" stroke="none"/><rect x="810" y="160" width="6" height="370" rx="2" fill="#7447a5" stroke="none"/><text x="832" y="197.0" font-size="24" font-weight="700" fill="#7447a5">Optional server / GPU</text><text x="832" y="262.0" font-size="22" font-weight="400" fill="#162b42">Large training jobs and</text><text x="832" y="291.7" font-size="22" font-weight="400" fill="#162b42">optional model requests</text><text x="832" y="321.4" font-size="22" font-weight="400" fill="#162b42">run outside the default</text><text x="832" y="351.1" font-size="22" font-weight="400" fill="#162b42">lesson. Review what data</text><text x="832" y="380.8" font-size="22" font-weight="400" fill="#162b42">leaves the browser. Keep</text><text x="832" y="410.5" font-size="22" font-weight="400" fill="#162b42">keys off the public site.</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Browser-native computation does not mean offline-only or automatically private.</text></svg>
