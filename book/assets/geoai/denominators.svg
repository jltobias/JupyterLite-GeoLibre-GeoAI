<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">The denominator changes the story</title><desc id="desc">The denominator changes the story | Read every indicator&#x27;s eligible population, reporting period and missingness. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Population living with HIV | 10,000 | Know their status | 8,000 | On treatment | 6,000 | Virally suppressed | 5,400 | 6,000 / 8,000 = 75%       but       6,000 / 10,000 = 60% | Entirely invented nested cohort. Real quarterly service counts may not form a cohort.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">The denominator changes the story</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Read every indicator&#x27;s eligible population, reporting period and missingness.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><text x="50" y="199.0" font-size="22" font-weight="700" fill="#225caa">Population living with HIV</text><rect x="425" y="170" width="600.0" height="42" rx="4" fill="#225caa" stroke="none"/><text x="1040" y="199.0" font-size="22" font-weight="700" fill="#225caa">10,000</text><text x="50" y="299.0" font-size="22" font-weight="700" fill="#08776f">Know their status</text><rect x="425" y="270" width="480.0" height="42" rx="4" fill="#08776f" stroke="none"/><text x="1040" y="299.0" font-size="22" font-weight="700" fill="#08776f">8,000</text><text x="50" y="399.0" font-size="22" font-weight="700" fill="#7447a5">On treatment</text><rect x="425" y="370" width="360.0" height="42" rx="4" fill="#7447a5" stroke="none"/><text x="1040" y="399.0" font-size="22" font-weight="700" fill="#7447a5">6,000</text><text x="50" y="499.0" font-size="22" font-weight="700" fill="#995b0c">Virally suppressed</text><rect x="425" y="470" width="324.0" height="42" rx="4" fill="#995b0c" stroke="none"/><text x="1040" y="499.0" font-size="22" font-weight="700" fill="#995b0c">5,400</text><text x="425" y="590.0" font-size="23" font-weight="700" fill="#162b42">6,000 / 8,000 = 75%       but       6,000 / 10,000 = 60%</text><rect x="40" y="615" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="654.0" font-size="22" font-weight="400" fill="#41576d">Entirely invented nested cohort. Real quarterly service counts may not form a cohort.</text></svg>
