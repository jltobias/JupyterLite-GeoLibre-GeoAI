<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">How geography becomes Python data</title><desc id="desc">How geography becomes Python data | Keep the meaning attached when turning maps into numbers. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Input | Python representation | Meaning to preserve | Clinic locations | GeoDataFrame / coordinates | CRS, date, service availability | Satellite pixels | Array + georeferencing | Units, clouds, resolution | Road connections | Nodes + weighted edges | Travel time, closures, direction | District indicators | Rows + numeric columns | Denominator, period, uncertainty | Features are measurable model inputs, not neutral replacements for people or places.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">How geography becomes Python data</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Keep the meaning attached when turning maps into numbers.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><text x="55" y="177.0" font-size="24" font-weight="700" fill="#225caa">Input</text><text x="430" y="177.0" font-size="24" font-weight="700" fill="#225caa">Python representation</text><text x="805" y="177.0" font-size="24" font-weight="700" fill="#225caa">Meaning to preserve</text><rect x="40" y="203" width="1120" height="70" rx="14" fill="#eaf2fd" stroke="none"/><text x="55" y="244.0" font-size="20" font-weight="400" fill="#162b42">Clinic locations</text><text x="430" y="244.0" font-size="20" font-weight="400" fill="#162b42">GeoDataFrame / coordinates</text><text x="805" y="244.0" font-size="20" font-weight="400" fill="#162b42">CRS, date, service availability</text><rect x="40" y="288" width="1120" height="70" rx="14" fill="#e5f5f0" stroke="none"/><text x="55" y="329.0" font-size="20" font-weight="400" fill="#162b42">Satellite pixels</text><text x="430" y="329.0" font-size="20" font-weight="400" fill="#162b42">Array + georeferencing</text><text x="805" y="329.0" font-size="20" font-weight="400" fill="#162b42">Units, clouds, resolution</text><rect x="40" y="373" width="1120" height="70" rx="14" fill="#f1eafa" stroke="none"/><text x="55" y="414.0" font-size="20" font-weight="400" fill="#162b42">Road connections</text><text x="430" y="414.0" font-size="20" font-weight="400" fill="#162b42">Nodes + weighted edges</text><text x="805" y="414.0" font-size="20" font-weight="400" fill="#162b42">Travel time, closures, direction</text><rect x="40" y="458" width="1120" height="70" rx="14" fill="#fff3d9" stroke="none"/><text x="55" y="499.0" font-size="20" font-weight="400" fill="#162b42">District indicators</text><text x="430" y="499.0" font-size="20" font-weight="400" fill="#162b42">Rows + numeric columns</text><text x="805" y="499.0" font-size="20" font-weight="400" fill="#162b42">Denominator, period, uncertainty</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Features are measurable model inputs, not neutral replacements for people or places.</text></svg>
