<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Heat stress: a hot pixel is a starting point</title><desc id="desc">Heat stress: a hot pixel is a starting point | Potential application: identify places needing better exposure data and protective services. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Satellite surface | Land surface temperature | describes the ground or | canopy observed at a | particular time. | 1 | Human exposure | Air temperature, | humidity, sun, wind, | housing and activity | shape experienced heat. | Add ground observations. | 2 | Program question | Where might cooling | access or worker | protection be | insufficient? Validate | with exposure and health | evidence. | 3 | Lab 12 uses invented temperature values and a rule; it is not a heat-health forecast.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Heat stress: a hot pixel is a starting point</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Potential application: identify places needing better exposure data and protective services.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="180" width="350" height="350" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="180" width="6" height="350" rx="2" fill="#225caa" stroke="none"/><text x="62" y="217.0" font-size="24" font-weight="700" fill="#225caa">Satellite surface</text><text x="62" y="282.0" font-size="22" font-weight="400" fill="#162b42">Land surface temperature</text><text x="62" y="311.7" font-size="22" font-weight="400" fill="#162b42">describes the ground or</text><text x="62" y="341.4" font-size="22" font-weight="400" fill="#162b42">canopy observed at a</text><text x="62" y="371.1" font-size="22" font-weight="400" fill="#162b42">particular time.</text><circle cx="70" cy="570" r="15" fill="#225caa"/><text x="63" y="577.0" font-size="20" font-weight="700" fill="white">1</text><path d="M391 350 L415 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="180" width="350" height="350" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="180" width="6" height="350" rx="2" fill="#08776f" stroke="none"/><text x="442" y="217.0" font-size="24" font-weight="700" fill="#08776f">Human exposure</text><text x="442" y="282.0" font-size="22" font-weight="400" fill="#162b42">Air temperature,</text><text x="442" y="311.7" font-size="22" font-weight="400" fill="#162b42">humidity, sun, wind,</text><text x="442" y="341.4" font-size="22" font-weight="400" fill="#162b42">housing and activity</text><text x="442" y="371.1" font-size="22" font-weight="400" fill="#162b42">shape experienced heat.</text><text x="442" y="400.8" font-size="22" font-weight="400" fill="#162b42">Add ground observations.</text><circle cx="450" cy="570" r="15" fill="#08776f"/><text x="443" y="577.0" font-size="20" font-weight="700" fill="white">2</text><path d="M771 350 L795 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="350" height="350" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="180" width="6" height="350" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="217.0" font-size="24" font-weight="700" fill="#7447a5">Program question</text><text x="822" y="282.0" font-size="22" font-weight="400" fill="#162b42">Where might cooling</text><text x="822" y="311.7" font-size="22" font-weight="400" fill="#162b42">access or worker</text><text x="822" y="341.4" font-size="22" font-weight="400" fill="#162b42">protection be</text><text x="822" y="371.1" font-size="22" font-weight="400" fill="#162b42">insufficient? Validate</text><text x="822" y="400.8" font-size="22" font-weight="400" fill="#162b42">with exposure and health</text><text x="822" y="430.5" font-size="22" font-weight="400" fill="#162b42">evidence.</text><circle cx="830" cy="570" r="15" fill="#7447a5"/><text x="823" y="577.0" font-size="20" font-weight="700" fill="white">3</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Lab 12 uses invented temperature values and a rule; it is not a heat-health forecast.</text></svg>
