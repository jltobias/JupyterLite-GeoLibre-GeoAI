<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif"><title id="title">Food and water insecurity: follow the whole chain</title><desc id="desc">Food and water insecurity: follow the whole chain | Combine environmental signals with access, affordability and service evidence. | GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data | Environmental stress | Rainfall anomalies, water | availability, crop | conditions and seasonal | context. Distinguish dry | weather from long-term | change. | 1 | People and systems | Markets, food prices, | livelihoods, storage, | safe water access and | functioning supply | systems. | 2 | Health / action | evidence | Nutrition and service | indicators plus local | assessments. Evaluate | whether assistance | reaches those needing it. | 3 | Greenness is not food security. Visible water is not available or safe drinking water.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#41576d"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fbfcfe" stroke="none"/><rect x="0" y="0" width="1200" height="10" rx="0" fill="#08776f" stroke="none"/><text x="40" y="61.0" font-size="34" font-weight="700" fill="#162b42">Food and water insecurity: follow the whole chain</text><text x="40" y="104.0" font-size="22" font-weight="400" fill="#41576d">Combine environmental signals with access, affordability and service evidence.</text><text x="40" y="702.0" font-size="17" font-weight="400" fill="#41576d">GEOAI FIELD GUIDE  /  Original teaching schematic — not observed health data</text><rect x="40" y="180" width="350" height="350" rx="14" fill="#eaf2fd" stroke="none"/><rect x="40" y="180" width="6" height="350" rx="2" fill="#225caa" stroke="none"/><text x="62" y="217.0" font-size="24" font-weight="700" fill="#225caa">Environmental stress</text><text x="62" y="282.0" font-size="22" font-weight="400" fill="#162b42">Rainfall anomalies, water</text><text x="62" y="311.7" font-size="22" font-weight="400" fill="#162b42">availability, crop</text><text x="62" y="341.4" font-size="22" font-weight="400" fill="#162b42">conditions and seasonal</text><text x="62" y="371.1" font-size="22" font-weight="400" fill="#162b42">context. Distinguish dry</text><text x="62" y="400.8" font-size="22" font-weight="400" fill="#162b42">weather from long-term</text><text x="62" y="430.5" font-size="22" font-weight="400" fill="#162b42">change.</text><circle cx="70" cy="570" r="15" fill="#225caa"/><text x="63" y="577.0" font-size="20" font-weight="700" fill="white">1</text><path d="M391 350 L415 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="180" width="350" height="350" rx="14" fill="#e5f5f0" stroke="none"/><rect x="420" y="180" width="6" height="350" rx="2" fill="#08776f" stroke="none"/><text x="442" y="217.0" font-size="24" font-weight="700" fill="#08776f">People and systems</text><text x="442" y="282.0" font-size="22" font-weight="400" fill="#162b42">Markets, food prices,</text><text x="442" y="311.7" font-size="22" font-weight="400" fill="#162b42">livelihoods, storage,</text><text x="442" y="341.4" font-size="22" font-weight="400" fill="#162b42">safe water access and</text><text x="442" y="371.1" font-size="22" font-weight="400" fill="#162b42">functioning supply</text><text x="442" y="400.8" font-size="22" font-weight="400" fill="#162b42">systems.</text><circle cx="450" cy="570" r="15" fill="#08776f"/><text x="443" y="577.0" font-size="20" font-weight="700" fill="white">2</text><path d="M771 350 L795 350" stroke="#41576d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="800" y="180" width="350" height="350" rx="14" fill="#f1eafa" stroke="none"/><rect x="800" y="180" width="6" height="350" rx="2" fill="#7447a5" stroke="none"/><text x="822" y="217.0" font-size="24" font-weight="700" fill="#7447a5">Health / action</text><text x="822" y="249.4" font-size="24" font-weight="700" fill="#7447a5">evidence</text><text x="822" y="282.0" font-size="22" font-weight="400" fill="#162b42">Nutrition and service</text><text x="822" y="311.7" font-size="22" font-weight="400" fill="#162b42">indicators plus local</text><text x="822" y="341.4" font-size="22" font-weight="400" fill="#162b42">assessments. Evaluate</text><text x="822" y="371.1" font-size="22" font-weight="400" fill="#162b42">whether assistance</text><text x="822" y="400.8" font-size="22" font-weight="400" fill="#162b42">reaches those needing it.</text><circle cx="830" cy="570" r="15" fill="#7447a5"/><text x="823" y="577.0" font-size="20" font-weight="700" fill="white">3</text><rect x="40" y="605" width="1120" height="65" rx="14" fill="#edf2f6" stroke="none"/><text x="60" y="644.0" font-size="22" font-weight="400" fill="#41576d">Greenness is not food security. Visible water is not available or safe drinking water.</text></svg>
