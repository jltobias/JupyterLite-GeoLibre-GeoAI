<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">A proposal is not an instruction to execute</title><desc id="desc">Inspect meaning as well as format before a map changes. 1 · Propose: Local model returns four JSON settings for one invented layer.; 2 · Validate: Python rejects unknown fields, layers and invalid numbers.; 3 · Preview: Compute feature IDs and counts from the actual fixture.; 4 · Approve: A person checks the request, then chooses whether to apply. Valid JSON can still be wrong. A selected cell is not a predicted health outcome.</desc><rect x="0" y="0" width="1280" height="600" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="50.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">A proposal is not an instruction to execute</text><text x="30" y="94.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#45576c">Inspect meaning as well as format before a map changes.</text><rect x="30" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="48" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2459b8">1 · Propose</text><text x="48" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Local model returns</text><text x="48" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">four JSON settings</text><text x="48" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">for one invented</text><text x="48" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">layer.</text><text x="315" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="343" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="361" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f78">2 · Validate</text><text x="361" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Python rejects</text><text x="361" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">unknown fields,</text><text x="361" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">layers and invalid</text><text x="361" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">numbers.</text><text x="628" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="656" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="674" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7545b3">3 · Preview</text><text x="674" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Compute feature IDs</text><text x="674" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">and counts from the</text><text x="674" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">actual fixture.</text><text x="941" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="969" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="987" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#a96112">4 · Approve</text><text x="987" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A person checks the</text><text x="987" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">request, then</text><text x="987" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">chooses whether to</text><text x="987" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">apply.</text><text x="30" y="495.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14283f">Valid JSON can still be wrong. A selected cell is not a predicted health outcome.</text><text x="30" y="579.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576c">Original teaching schematic. Arrows are a reasoning sequence, not a historical timeline.</text></svg>
