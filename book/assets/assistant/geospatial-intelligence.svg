<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">From geographic context to accountable action</title><desc id="desc">This book&#x27;s synthesis: complementary capabilities, not a replacement ladder. GIS: Locate, connect, measure and document geographic evidence.; GeoAI: Learn patterns or assist operations while retaining spatial context.; Human judgment: Question evidence, harms, benefits, alternatives and uncertainty.; Intelligence: Use checked knowledge for a decision; evaluate what happened. World models are a further research direction. A chatbot plus a map is not one.</desc><rect x="0" y="0" width="1280" height="600" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="50.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">From geographic context to accountable action</text><text x="30" y="94.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#45576c">This book&#x27;s synthesis: complementary capabilities, not a replacement ladder.</text><rect x="30" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="48" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2459b8">GIS</text><text x="48" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Locate, connect,</text><text x="48" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">measure and document</text><text x="48" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">geographic evidence.</text><text x="315" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="343" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="361" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f78">GeoAI</text><text x="361" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Learn patterns or</text><text x="361" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">assist operations</text><text x="361" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">while retaining</text><text x="361" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">spatial context.</text><text x="628" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="656" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="674" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7545b3">Human judgment</text><text x="674" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Question evidence,</text><text x="674" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">harms, benefits,</text><text x="674" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">alternatives and</text><text x="674" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">uncertainty.</text><text x="941" y="300.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="969" y="140" width="280" height="290" rx="16" fill="white" stroke="#cddbe9"/><text x="987" y="184.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#a96112">Intelligence</text><text x="987" y="235.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Use checked</text><text x="987" y="267.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">knowledge for a</text><text x="987" y="299.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">decision; evaluate</text><text x="987" y="331.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">what happened.</text><text x="30" y="495.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14283f">World models are a further research direction. A chatbot plus a map is not one.</text><text x="30" y="579.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576c">Original teaching schematic. Arrows are a reasoning sequence, not a historical timeline.</text></svg>
