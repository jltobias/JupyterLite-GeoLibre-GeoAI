<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">Two interfaces. One local inference service.</title><desc id="desc">The native route sends a GeoLibre conversation to a local model and uses GeoLibre tools. The separate notebook route validates a bounded plan and requires human approval. Both render in the browser; neither runs the language model inside Pyodide.</desc><rect x="0" y="0" width="1280" height="660" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="50.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">Two interfaces. One local inference service.</text><text x="30" y="95.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#45576c">Separate map state; separate permissions; shared responsibility to check results.</text><text x="30" y="153.0" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#2459b8">NATIVE GEOLIBRE</text><rect x="30" y="176" width="370" height="96" rx="16" fill="white" stroke="#2459b8"/><text x="50" y="217.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">GeoLibre chat</text><text x="50" y="250.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">In your browser</text><text x="407" y="237.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#45576c">↔</text><rect x="444" y="176" width="370" height="96" rx="16" fill="white" stroke="#2459b8"/><text x="464" y="217.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">Local Ollama</text><text x="464" y="250.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">On your desktop</text><text x="821" y="237.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#45576c">↔</text><rect x="858" y="176" width="370" height="96" rx="16" fill="white" stroke="#2459b8"/><text x="878" y="217.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">GeoLibre tools</text><text x="878" y="250.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">In your browser</text><text x="30" y="318.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Inspect transcript and map; decline code fallback in this exercise.</text><text x="30" y="373.0" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#087f78">NOTEBOOK LESSON</text><rect x="30" y="396" width="370" height="96" rx="16" fill="white" stroke="#087f78"/><text x="50" y="437.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f78">JupyterLite prompt</text><text x="50" y="470.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">In your browser</text><text x="407" y="457.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#45576c">↔</text><rect x="444" y="396" width="370" height="96" rx="16" fill="white" stroke="#087f78"/><text x="464" y="437.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f78">Local Ollama</text><text x="464" y="470.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">On your desktop</text><text x="821" y="457.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#45576c">↔</text><rect x="858" y="396" width="370" height="96" rx="16" fill="white" stroke="#087f78"/><text x="878" y="437.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#087f78">Validated plan</text><text x="878" y="470.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">In your browser</text><text x="30" y="538.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Preview in Python → human approval → create a GeoLibre map.</text><text x="30" y="622.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#a96112">Local model ≠ fully offline app. Basemaps and remote data still use external services.</text></svg>
