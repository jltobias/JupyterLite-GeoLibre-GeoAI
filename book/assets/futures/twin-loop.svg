<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc"><title id="title">A digital twin needs a checked feedback loop</title><desc id="desc">A digital twin needs a checked feedback loop. A map is one view. A twin also needs mechanisms, evidence and an update process. 1. Observe: Governed geography, services and dated observations. Record what is missing.. 2. Model: Explicit agents, networks and assumptions. Calibrate; validate separately.. 3. Compare: Repeat baseline and scenario runs. Show uncertainty and failures.. 4. Review: People inspect results. Document changes before updating the model. Feedback means reviewed updates, not automatic operational decisions.</desc><rect x="0" y="0" width="1280" height="630" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="46.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">A digital twin needs a checked feedback loop</text><text x="30" y="89.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#45576c">A map is one view. A twin also needs mechanisms, evidence and an update process.</text><rect x="30.0" y="140" width="284.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="30.0" y="140" width="284.0" height="8" rx="0" fill="#2459b8" stroke="none"/><text x="48.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2459b8">1. Observe</text><text x="48.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Governed geography,</text><text x="48.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">services and dated</text><text x="48.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">observations. Record</text><text x="48.0" y="365.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">what is missing.</text><text x="318.0" y="306.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#45576c">→</text><rect x="342.0" y="140" width="284.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="342.0" y="140" width="284.0" height="8" rx="0" fill="#087f78" stroke="none"/><text x="360.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f78">2. Model</text><text x="360.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Explicit agents,</text><text x="360.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">networks and</text><text x="360.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">assumptions.</text><text x="360.0" y="365.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Calibrate; validate</text><text x="360.0" y="397.8" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">separately.</text><text x="630.0" y="306.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#45576c">→</text><rect x="654.0" y="140" width="284.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="654.0" y="140" width="284.0" height="8" rx="0" fill="#7545b3" stroke="none"/><text x="672.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7545b3">3. Compare</text><text x="672.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Repeat baseline and</text><text x="672.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">scenario runs. Show</text><text x="672.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">uncertainty and</text><text x="672.0" y="365.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">failures.</text><text x="942.0" y="306.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#45576c">→</text><rect x="966.0" y="140" width="284.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="966.0" y="140" width="284.0" height="8" rx="0" fill="#a96112" stroke="none"/><text x="984.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#a96112">4. Review</text><text x="984.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">People inspect</text><text x="984.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">results. Document</text><text x="984.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">changes before</text><text x="984.0" y="365.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">updating the model.</text><path d="M1100 454 V482 H174 V458" fill="none" stroke="#087f78" stroke-width="3" /><path d="M167 466 L174 455 L181 466" fill="none" stroke="#087f78" stroke-width="3" /><text x="30" y="533.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">Feedback means reviewed updates, not automatic operational decisions.</text><text x="30" y="602.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576c">Original teaching schematic. Proposed concepts, not an implemented service or measured result.</text></svg>
