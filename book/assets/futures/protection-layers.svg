<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="630" viewBox="0 0 1280 630" role="img" aria-labelledby="title desc"><title id="title">Three controls, three different questions</title><desc id="desc">Three controls, three different questions. Combine them deliberately. None alone guarantees anonymity after release. Encryption: Who can read the payload? A cryptographic key protects access to plaintext.. Masking: How precise is the display? Change or generalize positions; assess residual risk.. Aggregation: What group detail is needed? Combine records; inspect small and rare groups. Access control and human release review surround all three.</desc><rect x="0" y="0" width="1280" height="630" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="46.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">Three controls, three different questions</text><text x="30" y="89.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#45576c">Combine them deliberately. None alone guarantees anonymity after release.</text><rect x="30.0" y="140" width="388.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="30.0" y="140" width="388.0" height="8" rx="0" fill="#2459b8" stroke="none"/><text x="48.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#2459b8">Encryption</text><text x="48.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Who can read the payload? A</text><text x="48.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">cryptographic key protects</text><text x="48.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">access to plaintext.</text><rect x="446.0" y="140" width="388.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="446.0" y="140" width="388.0" height="8" rx="0" fill="#087f78" stroke="none"/><text x="464.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#087f78">Masking</text><text x="464.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">How precise is the display?</text><text x="464.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Change or generalize</text><text x="464.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">positions; assess residual</text><text x="464.0" y="365.6" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">risk.</text><rect x="862.0" y="140" width="388.0" height="300" rx="16" fill="white" stroke="#cddbe9"/><rect x="862.0" y="140" width="388.0" height="8" rx="0" fill="#7545b3" stroke="none"/><text x="880.0" y="196.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#7545b3">Aggregation</text><text x="880.0" y="269.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">What group detail is needed?</text><text x="880.0" y="301.2" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Combine records; inspect</text><text x="880.0" y="333.4" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">small and rare groups.</text><text x="30" y="533.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">Access control and human release review surround all three.</text><text x="30" y="602.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#45576c">Original teaching schematic. Proposed concepts, not an implemented service or measured result.</text></svg>
