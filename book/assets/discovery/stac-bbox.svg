<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc"><title id="title">A search box selects records; it does not cut files</title><desc id="desc">Schematic: A is inside the purple study box, B crosses its edge, and C is outside. Keep A and B as candidates; exclude C. Their original footprints and raster files remain unchanged.</desc><rect x="0" y="0" width="1280" height="690" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="50.0" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#14283f">A search box selects records; it does not cut files</text><text x="30" y="92.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">Filter by overlap, then inspect the metadata and actual coverage.</text><rect x="30" y="125" width="690" height="460" rx="16" fill="white" stroke="#cddbe9"/><path d="M70 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M110 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M150 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M190 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M230 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M270 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M310 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M350 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M390 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M430 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M470 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M510 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M550 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M590 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M630 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M670 145 V565" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 145 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 185 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 225 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 265 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 305 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 345 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 385 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 425 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 465 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 505 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><path d="M50 545 H700" fill="none" stroke="#e1e8ef" stroke-width="1" /><rect x="75" y="175" width="105" height="85" fill="#64748b" fill-opacity=".12" stroke="#64748b" stroke-width="3"/><text x="90" y="210.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#64748b">C</text><rect x="265" y="290" width="105" height="85" fill="#2459b8" fill-opacity=".12" stroke="#2459b8" stroke-width="3"/><text x="280" y="325.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">A</text><rect x="445" y="395" width="220" height="120" fill="#2459b8" fill-opacity=".12" stroke="#2459b8" stroke-width="3"/><text x="460" y="430.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">B</text><rect x="210" y="240" width="310" height="225" fill="none" stroke="#7545b3" stroke-width="5"/><text x="210" y="222.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Your study bbox</text><text x="742" y="180.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#2459b8">A + B: keep as candidates</text><text x="742" y="221.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Both footprints overlap the box.</text><text x="742" y="253.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">B need not fit inside it.</text><text x="742" y="325.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#64748b">C: outside the search area</text><text x="742" y="366.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Exclude this footprint from this</text><text x="742" y="398.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">spatial search.</text><text x="742" y="470.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#7545b3">Still not a crop</text><text x="742" y="511.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">A and B retain their full</text><text x="742" y="543.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">footprints. No pixels have been</text><text x="742" y="575.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">cut or read.</text><text x="30" y="630.0" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#14283f">Coordinates: west, south, east, north — longitude / latitude in degrees.</text><text x="30" y="673.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#45576c">Original schematic, not real geography. Dates and collection choice can narrow results further.</text></svg>
