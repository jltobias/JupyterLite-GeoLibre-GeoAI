<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc"><title id="title">Follow the record to the right file</title><desc id="desc">A common STAC route: context first, then the asset you actually need. Catalog: Find entry points and related catalogs.. Collection: Read product context, coverage and license.. Item: Inspect one record: identifier, footprint and time.. Assets: Choose data, a preview or metadata. Check the role.</desc><rect x="0" y="0" width="1280" height="600" rx="0" fill="#f5f7fa" stroke="none"/><text x="30" y="48.0" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14283f">Follow the record to the right file</text><text x="30" y="90.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#45576c">A common STAC route: context first, then the asset you actually need.</text><rect x="30" y="145" width="280" height="285" rx="16" fill="white" stroke="#cddbe9"/><rect x="30" y="145" width="280" height="8" rx="0" fill="#2459b8" stroke="none"/><text x="48" y="201.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#2459b8">Catalog</text><text x="48" y="266.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Find entry points</text><text x="48" y="298.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">and related</text><text x="48" y="330.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">catalogs.</text><text x="315" y="305.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="342" y="145" width="280" height="285" rx="16" fill="white" stroke="#cddbe9"/><rect x="342" y="145" width="280" height="8" rx="0" fill="#087f78" stroke="none"/><text x="360" y="201.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#087f78">Collection</text><text x="360" y="266.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Read product</text><text x="360" y="298.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">context, coverage</text><text x="360" y="330.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">and license.</text><text x="627" y="305.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="654" y="145" width="280" height="285" rx="16" fill="white" stroke="#cddbe9"/><rect x="654" y="145" width="280" height="8" rx="0" fill="#7545b3" stroke="none"/><text x="672" y="201.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#7545b3">Item</text><text x="672" y="266.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Inspect one record:</text><text x="672" y="298.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">identifier,</text><text x="672" y="330.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">footprint and time.</text><text x="939" y="305.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#45576c">→</text><rect x="966" y="145" width="280" height="285" rx="16" fill="white" stroke="#cddbe9"/><rect x="966" y="145" width="280" height="8" rx="0" fill="#a96112" stroke="none"/><text x="984" y="201.0" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a96112">Assets</text><text x="984" y="266.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">Choose data, a</text><text x="984" y="298.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">preview or</text><text x="984" y="330.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">metadata. Check the</text><text x="984" y="363.2" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14283f">role.</text><text x="30" y="490.0" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14283f">A footprint describes coverage. It does not contain the raster pixels.</text><text x="30" y="537.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#45576c">Catalogs may nest; one Item may have several assets. Follow the advertised links.</text><text x="30" y="579.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#45576c">Original teaching schematic, not a live catalog response.</text></svg>
