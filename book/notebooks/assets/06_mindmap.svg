<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">One workflow across three runtimes concept map</title>
<desc id="desc">Browser: Small arrays, maps and lightweight models. GeoLibre: Hosted viewer renders cloud GIS sources. Server: Astra API credentials stay outside the browser. GPU: Full GeoAI handles large model inference</desc>
<rect width="1200" height="550" rx="22" fill="#f1f5f9"/>
<text x="42" y="49" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">One workflow across three runtimes</text>
<text x="42" y="79" font-family="sans-serif" font-size="16" fill="#475569">Observe the evidence  /  connect the representations  /  test the explanation</text>
<path d="M 600 285 Q 600 190 405 190" stroke="#2563eb" stroke-width="3" fill="none"/>
<rect x="35" y="125" width="370" height="135" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="55" y="157" fill="#2563eb" font-family="sans-serif" font-size="21" font-weight="700">Browser</text>
<text x="55" y="185" fill="#334155" font-family="sans-serif" font-size="17">Small arrays, maps and lightweight</text>
<text x="55" y="208" fill="#334155" font-family="sans-serif" font-size="17">models</text>
<path d="M 600 285 Q 600 190 795 190" stroke="#0f766e" stroke-width="3" fill="none"/>
<rect x="795" y="125" width="370" height="135" rx="15" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="815" y="157" fill="#0f766e" font-family="sans-serif" font-size="21" font-weight="700">GeoLibre</text>
<text x="815" y="185" fill="#334155" font-family="sans-serif" font-size="17">Hosted viewer renders cloud GIS</text>
<text x="815" y="208" fill="#334155" font-family="sans-serif" font-size="17">sources</text>
<path d="M 600 285 Q 600 420 405 420" stroke="#9333ea" stroke-width="3" fill="none"/>
<rect x="35" y="355" width="370" height="135" rx="15" fill="white" stroke="#9333ea" stroke-width="2"/>
<text x="55" y="387" fill="#9333ea" font-family="sans-serif" font-size="21" font-weight="700">Server</text>
<text x="55" y="415" fill="#334155" font-family="sans-serif" font-size="17">Astra API credentials stay outside</text>
<text x="55" y="438" fill="#334155" font-family="sans-serif" font-size="17">the browser</text>
<path d="M 600 285 Q 600 420 795 420" stroke="#b45309" stroke-width="3" fill="none"/>
<rect x="795" y="355" width="370" height="135" rx="15" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="815" y="387" fill="#b45309" font-family="sans-serif" font-size="21" font-weight="700">GPU</text>
<text x="815" y="415" fill="#334155" font-family="sans-serif" font-size="17">Full GeoAI handles large model</text>
<text x="815" y="438" fill="#334155" font-family="sans-serif" font-size="17">inference</text>
<rect x="435" y="225" width="330" height="120" rx="22" fill="#0f172a"/>
<text x="600" y="274" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="700">Spatial understanding</text>
<text x="600" y="307" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="18">map + measure + question</text>
</svg>