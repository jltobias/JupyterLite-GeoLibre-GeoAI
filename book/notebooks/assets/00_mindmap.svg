<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Browser GIS: from source to understanding concept map</title>
<desc id="desc">Sources: GeoJSON vectors, COG rasters, PMTiles. Coordinates: GeoJSON stores longitude before latitude. Representations: The map links values to their locations. Check: Keep units, attribution and view settings</desc>
<rect width="1200" height="550" rx="22" fill="#f1f5f9"/>
<text x="42" y="49" font-family="sans-serif" font-size="25" font-weight="700" fill="#0f172a">Browser GIS: from source to understanding</text>
<text x="42" y="79" font-family="sans-serif" font-size="16" fill="#475569">Observe the evidence  /  connect the representations  /  test the explanation</text>
<path d="M 600 285 Q 600 190 405 190" stroke="#2563eb" stroke-width="3" fill="none"/>
<rect x="35" y="125" width="370" height="135" rx="15" fill="white" stroke="#2563eb" stroke-width="2"/>
<text x="55" y="157" fill="#2563eb" font-family="sans-serif" font-size="21" font-weight="700">Sources</text>
<text x="55" y="185" fill="#334155" font-family="sans-serif" font-size="17">GeoJSON vectors, COG rasters,</text>
<text x="55" y="208" fill="#334155" font-family="sans-serif" font-size="17">PMTiles</text>
<path d="M 600 285 Q 600 190 795 190" stroke="#0f766e" stroke-width="3" fill="none"/>
<rect x="795" y="125" width="370" height="135" rx="15" fill="white" stroke="#0f766e" stroke-width="2"/>
<text x="815" y="157" fill="#0f766e" font-family="sans-serif" font-size="21" font-weight="700">Coordinates</text>
<text x="815" y="185" fill="#334155" font-family="sans-serif" font-size="17">GeoJSON stores longitude before</text>
<text x="815" y="208" fill="#334155" font-family="sans-serif" font-size="17">latitude</text>
<path d="M 600 285 Q 600 420 405 420" stroke="#9333ea" stroke-width="3" fill="none"/>
<rect x="35" y="355" width="370" height="135" rx="15" fill="white" stroke="#9333ea" stroke-width="2"/>
<text x="55" y="387" fill="#9333ea" font-family="sans-serif" font-size="21" font-weight="700">Representations</text>
<text x="55" y="415" fill="#334155" font-family="sans-serif" font-size="17">The map links values to their</text>
<text x="55" y="438" fill="#334155" font-family="sans-serif" font-size="17">locations</text>
<path d="M 600 285 Q 600 420 795 420" stroke="#b45309" stroke-width="3" fill="none"/>
<rect x="795" y="355" width="370" height="135" rx="15" fill="white" stroke="#b45309" stroke-width="2"/>
<text x="815" y="387" fill="#b45309" font-family="sans-serif" font-size="21" font-weight="700">Check</text>
<text x="815" y="415" fill="#334155" font-family="sans-serif" font-size="17">Keep units, attribution and view</text>
<text x="815" y="438" fill="#334155" font-family="sans-serif" font-size="17">settings</text>
<rect x="435" y="225" width="330" height="120" rx="22" fill="#0f172a"/>
<text x="600" y="274" text-anchor="middle" fill="white" font-family="sans-serif" font-size="24" font-weight="700">Spatial understanding</text>
<text x="600" y="307" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="18">map + measure + question</text>
</svg>