<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">A bridge changes the reachable world</title><desc id="desc">Represent travel possibilities as nodes, edges and minute costs. Remove one bridge and recompute routes to the same destination. Show who gains travel time and how a threshold changes covered-node counts. Vary speed assumptions before asking an optional model to interpret computed evidence. Graph analysis plus optional bounded model tools; shortest paths are computed by an explicit algorithm.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 15 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">A bridge changes the reachable world</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How does one closure change access to a destination?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Connect</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Represent travel</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">possibilities as nodes,</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">edges and minute costs.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Reroute</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Remove one bridge and</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">recompute routes to the</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">same destination.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Compare</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Show who gains travel time</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">and how a threshold changes</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">covered-node counts.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Test</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Vary speed assumptions</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">before asking an optional</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">model to interpret computed</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">evidence.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><rect x="220" y="5" width="25" height="195" rx="2" fill="#acd2e6" stroke="none"/><path d="M65 50 L170 50" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 50 L290 50" fill="none" stroke="#a96112" stroke-width="4" stroke-dasharray="7 5"/><path d="M290 50 L440 50" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M65 50 L65 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 50 L170 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M290 50 L290 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M440 50 L440 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M65 155 L170 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 155 L290 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M290 155 L440 155" fill="none" stroke="#90a8bf" stroke-width="4" /><circle cx="65" cy="50" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="60" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">0</text><circle cx="170" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="165" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">1</text><circle cx="290" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="285" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">2</text><circle cx="440" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="435" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">3</text><circle cx="65" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="60" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">4</text><circle cx="170" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="165" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">5</text><circle cx="290" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="285" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">6</text><circle cx="440" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="435" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">7</text><text x="25" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Connections constrain paths (illustrative graph).</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A small controlled network reveals how</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">connectivity and assumptions affect an</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">apparently simple access percentage.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Does 80% node coverage mean 80% population</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">coverage?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Graph analysis plus optional bounded model tools; shortest paths are computed by an explicit algorithm.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
