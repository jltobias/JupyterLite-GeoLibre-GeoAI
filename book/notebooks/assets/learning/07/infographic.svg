<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Read the catalog before the pixels</title><desc id="desc">Keep human-facing browser links beside machine-facing API addresses. Catalog and collection links lead toward item metadata. An item describes geometry and time and links to data or thumbnails. A working catalog page does not prove every data asset accepts browser requests. Discovery foundation: STAC organizes metadata; this notebook does not train a model.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 07 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">Read the catalog before the pixels</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How do we find an Earth dataset and understand its access path?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Browse</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Keep human-facing browser</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">links beside machine-facing</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">API addresses.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Follow</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Catalog and collection</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">links lead toward item</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">metadata.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Inspect</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">An item describes geometry</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">and time and links to data</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">or thumbnails.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Check access</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">A working catalog page does</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">not prove every data asset</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">accepts browser requests.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><rect x="20" y="66" width="145" height="90" rx="16" fill="white" stroke="#2459b8"/><text x="35" y="117.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#2459b8">Catalog</text><text x="171" y="118.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14283f">→</text><rect x="198" y="66" width="145" height="90" rx="16" fill="white" stroke="#087f78"/><text x="213" y="117.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#087f78">Item</text><text x="349" y="118.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14283f">→</text><rect x="376" y="66" width="145" height="90" rx="16" fill="white" stroke="#7545b3"/><text x="391" y="117.0" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7545b3">Asset</text><text x="25" y="215.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Follow the links and the computation boundary.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Reliable discovery records location, time,</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">links and licensing before a GeoAI workflow</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">spends resources on image assets.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Why does a skipped request differ from an empty</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">catalog?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Discovery foundation: STAC organizes metadata; this notebook does not train a model.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
