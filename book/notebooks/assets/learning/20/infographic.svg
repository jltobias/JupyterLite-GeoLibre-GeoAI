<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">From chat to checked evidence</title><desc id="desc">Give the assistant only the checked state needed for a follow-up. Inspect membership as well as the seven-to-four count change. Demonstrate rejection of unknown layers, URLs and unsafe values. Record evidence and disagreement without pretending to validate a health model. A follow-up planning exercise plus deterministic checks and human review; not a world model or clinical system.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 20 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">From chat to checked evidence</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">What changed, and what can we responsibly conclude?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Revise</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Give the assistant only the</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">checked state needed for a</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">follow-up.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Compare</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Inspect membership as well</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">as the seven-to-four count</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">change.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Challenge</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Demonstrate rejection of</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">unknown layers, URLs and</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">unsafe values.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Reflect</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Record evidence and</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">disagreement without</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">pretending to validate a</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">health model.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><rect x="40" y="52" width="42" height="63" rx="6" fill="#e2e8f0" stroke="#14283f"/><rect x="30" y="111" width="62" height="12" rx="6" fill="#e2e8f0" stroke="#14283f"/><text x="50" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">1</text><rect x="109" y="52" width="42" height="63" rx="6" fill="#cc4343" stroke="#14283f"/><rect x="99" y="111" width="62" height="12" rx="6" fill="#cc4343" stroke="#14283f"/><text x="119" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">2</text><rect x="178" y="52" width="42" height="63" rx="6" fill="#14283f" stroke="#14283f"/><rect x="168" y="111" width="62" height="12" rx="6" fill="#14283f" stroke="#14283f"/><text x="188" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">3</text><rect x="247" y="52" width="42" height="63" rx="6" fill="#eabf39" stroke="#14283f"/><rect x="237" y="111" width="62" height="12" rx="6" fill="#eabf39" stroke="#14283f"/><text x="257" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">4</text><rect x="316" y="52" width="42" height="63" rx="6" fill="#2e9670" stroke="#14283f"/><rect x="306" y="111" width="62" height="12" rx="6" fill="#2e9670" stroke="#14283f"/><text x="326" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">5</text><rect x="385" y="52" width="42" height="63" rx="6" fill="#2459b8" stroke="#14283f"/><rect x="375" y="111" width="62" height="12" rx="6" fill="#2459b8" stroke="#14283f"/><text x="395" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">6</text><rect x="454" y="52" width="42" height="63" rx="6" fill="#7545b3" stroke="#14283f"/><rect x="444" y="111" width="62" height="12" rx="6" fill="#7545b3" stroke="#14283f"/><text x="464" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">7</text><text x="38" y="204.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Questions → discussion → accountable action</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">An evidence card connects a map operation to</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">provenance, limits, alternatives and a named</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">human review step.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Does seven perspectives mean seven independent</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">AI evaluations?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">A follow-up planning exercise plus deterministic checks and human review; not a world model or clinical system.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
