<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Measure change before explaining it</title><desc id="desc">Calculate a per-pixel RGB difference between aligned invented scenes. Exclude the known synthetic cloud and apply an explicit threshold. Compare prediction with known change using error counts and overlap. Use computed area and a labeled figure to support, then check, an explanation. Image-analysis foundation with optional vision-model interpretation; the default RGB threshold is a deterministic rule.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 13 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">Measure change before explaining it</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How can an image explanation stay tied to reproducible evidence?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Compare</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Calculate a per-pixel RGB</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">difference between aligned</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">invented scenes.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Mask</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Exclude the known synthetic</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">cloud and apply an explicit</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">threshold.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Evaluate</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Compare prediction with</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">known change using error</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">counts and overlap.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Explain</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use computed area and a</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">labeled figure to support,</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">then check, an explanation.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><rect x="20" y="22" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="52" y="22" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="84" y="22" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="116" y="22" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="148" y="22" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="180" y="22" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="20" y="50" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="52" y="50" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="84" y="50" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="116" y="50" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="148" y="50" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="180" y="50" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="20" y="78" width="29