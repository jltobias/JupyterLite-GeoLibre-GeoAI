21" font-weight="400" fill="#14283f">Why does excellent accuracy here not validate a</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">real satellite model?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Image-analysis foundation with optional vision-model interpretation; the default RGB threshold is a deterministic</text><text x="46" y="846.6" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">rule.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
