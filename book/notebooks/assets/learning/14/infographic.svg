<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">One surface, three useful views</title><desc id="desc">Use local metre coordinates to define a known teaching surface. Calculate how elevation changes over distance, then express slope in degrees. Trace a fixed cross-section through the same surface shown in contours and 3D. Change vertical exaggeration and see why camera appearance is not a new measurement. Spatial analysis with optional model interpretation: derivatives measure shape; no terrain-learning model is fitted here.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 14 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">One surface, three useful views</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How do contours, profiles and 3D help us understand terrain?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Construct</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use local metre coordinates</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">to define a known teaching</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">surface.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Differentiate</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Calculate how elevation</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">changes over distance, then</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">express slope in degrees.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Link views</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Trace a fixed cross-section</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">through the same surface</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">shown in contours and 3D.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Question</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Change vertical</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">exaggeration and see why</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">camera appearance is not a</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">new measurement.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><ellipse cx="168" cy="106" rx="115" ry="80" fill="none" stroke="#087f78" stroke-width="3"/><ellipse cx="168" cy="106" rx="95" ry="67" fill="none" stroke="#087f78" stroke-width="3"/><ellipse cx="168" cy="106" rx="75" ry="54" fill="none" stroke="#087f78" stroke-width="3"/><ellipse cx="168" cy="106" rx="55" ry="41" fill="none" stroke="#087f78" stroke-width="3"/><ellipse cx="168" cy="106" rx="35" ry="28" fill="none" stroke="#087f78" stroke-width="3"/><path d="M320 180 L345 140 L378 48 L410 105 L435 134 L460 100 L505 180" fill="#b9e4dc" stroke="#087f78" stroke-width="4" /><path d="M38 106 H297" fill="none" stroke="#a96112" stroke-width="3" stroke-dasharray="7 5"/><text x="72" y="225.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">contours</text><text x="350" y="225.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">profile / shape</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A browser can make geometry and camera choices</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">tangible, helping people question a terrain</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">explanation before acting on it.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Can the highest cell have a gentler slope than a</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">cell on the hillside?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Spatial analysis with optional model interpretation: derivatives measure shape; no terrain-learning model is fitted</text><text x="46" y="846.6" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">here.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
