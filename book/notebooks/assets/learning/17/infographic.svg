<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">More perspectives, accountable decisions</title><desc id="desc">Name the case and trace what the report actually contributes. Use six perspectives plus the project&#x27;s purple synthesis extension. Turn the table into a workshop agenda that invites disagreement. Assign who will verify a claim and what evidence would change the decision. Human interpretation and governance: Python formats prompts; it does not run autonomous hat agents.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 17 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">More perspectives, accountable decisions</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How can people question a GeoAI result from several useful angles?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Ground</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Name the case and trace</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">what the report actually</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">contributes.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Question</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use six perspectives plus</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">the project&#x27;s purple</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">synthesis extension.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Discuss</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Turn the table into a</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">workshop agenda that</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">invites disagreement.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Act</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Assign who will verify a</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">claim and what evidence</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">would change the decision.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><rect x="40" y="52" width="42" height="63" rx="6" fill="#e2e8f0" stroke="#14283f"/><rect x="30" y="111" width="62" height="12" rx="6" fill="#e2e8f0" stroke="#14283f"/><text x="50" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">1</text><rect x="109" y="52" width="42" height="63" rx="6" fill="#cc4343" stroke="#14283f"/><rect x="99" y="111" width="62" height="12" rx="6" fill="#cc4343" stroke="#14283f"/><text x="119" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">2</text><rect x="178" y="52" width="42" height="63" rx="6" fill="#14283f" stroke="#14283f"/><rect x="168" y="111" width="62" height="12" rx="6" fill="#14283f" stroke="#14283f"/><text x="188" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">3</text><rect x="247" y="52" width="42" height="63" rx="6" fill="#eabf39" stroke="#14283f"/><rect x="237" y="111" width="62" height="12" rx="6" fill="#eabf39" stroke="#14283f"/><text x="257" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">4</text><rect x="316" y="52" width="42" height="63" rx="6" fill="#2e9670" stroke="#14283f"/><rect x="306" y="111" width="62" height="12" rx="6" fill="#2e9670" stroke="#14283f"/><text x="326" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">5</text><rect x="385" y="52" width="42" height="63" rx="6" fill="#2459b8" stroke="#14283f"/><rect x="375" y="111" width="62" height="12" rx="6" fill="#2459b8" stroke="#14283f"/><text x="395" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">6</text><rect x="454" y="52" width="42" height="63" rx="6" fill="#7545b3" stroke="#14283f"/><rect x="444" y="111" width="62" height="12" rx="6" fill="#7545b3" stroke="#14283f"/><text x="464" y="158.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14283f">7</text><text x="38" y="204.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Questions → discussion → accountable action</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A repeatable question set helps connect</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">computational results to evidence, lived</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">experience, alternatives and a responsible</text><text x="615" y="625.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">next action.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">What should purple synthesis do with a serious</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">unresolved disagreement?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Human interpretation and governance: Python formats prompts; it does not run autonomous hat agents.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
