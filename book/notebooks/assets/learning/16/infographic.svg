<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Keep the risk axes honest</title><desc id="desc">Start with ten cluster-ranked report rows and documented city aggregates. Display relative risk separately from original rank and facility counts. Compare A/B/C indicators as alternative scenarios, not as a forecast movie. Read 3D height as relative risk; it is not terrain or floodwater depth. Evidence interpretation supporting GeoAI: this notebook visualizes existing SaTScan results and fits no new model.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 16 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">Keep the risk axes honest</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How can we explore the report&#x27;s top ten clusters without mixing metrics?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Read</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Start with ten</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">cluster-ranked report rows</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">and documented city</text><text x="46" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">aggregates.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Compare</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Display relative risk</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">separately from original</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">rank and facility counts.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Animate</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Compare A/B/C indicators as</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">alternative scenarios, not</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">as a forecast movie.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Interpret</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Read 3D height as relative</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">risk; it is not terrain or</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">floodwater depth.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M30 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M80 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M130 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M180 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M230 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M280 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M330 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M380 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M430 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M480 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 30 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 70 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 110 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 150 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 190 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M10 160 Q120 30 215 100 T530 70" fill="none" stroke="#acd2e6" stroke-width="28" /><rect x="90" y="115" width="35" height="45" rx="3" fill="#2459b8" stroke="none"/><circle cx="107" cy="160" r="6" fill="#087f78" stroke="white" stroke-width="2"/><text x="100" y="187.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">A</text><rect x="245" y="35" width="35" height="115" rx="3" fill="#2459b8" stroke="none"/><circle cx="262" cy="150" r="6" fill="#087f78" stroke="white" stroke-width="2"/><text x="255" y="177.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">B</text><rect x="410" y="85" width="35" height="75" rx="3" fill="#2459b8" stroke="none"/><circle cx="427" cy="160" r="6" fill="#087f78" stroke="white" stroke-width="2"/><text x="420" y="187.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">C</text><text x="25" y="230.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Illustration: column height = relative risk</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Linked views help compare statistical risk,</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">reported facilities and scenario indicators</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">while exposing what additional evidence a</text><text x="615" y="625.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">decision needs.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Why should the two facility/site counts not be</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">interchanged?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Evidence interpretation supporting GeoAI: this notebook visualizes existing SaTScan results and fits no new model.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
