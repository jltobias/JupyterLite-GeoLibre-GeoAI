<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">A map is a data recipe</title><desc id="desc">A coordinate pair tells the map where to look: longitude first, latitude second. Vector places and raster elevations answer different questions about the same map. Display the map and compare a point with the raster beneath it. Keep the recipe so the source addresses and styling remain inspectable. Spatial foundation: this notebook does not fit a learning model.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 00 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">A map is a data recipe</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How do coordinates and layers become an explorable map?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Locate</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">A coordinate pair tells the</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">map where to look:</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">longitude first, latitude</text><text x="46" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">second.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Layer</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Vector places and raster</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">elevations answer different</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">questions about the same</text><text x="359" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">map.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Inspect</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Display the map and compare</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">a point with the raster</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">beneath it.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Preserve</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Keep the recipe so the</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">source addresses and</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">styling remain inspectable.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M30 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M80 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M130 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M180 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M230 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M280 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M330 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M380 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M430 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M480 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 30 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 70 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 110 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 150 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 190 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M10 160 Q120 30 215 100 T530 70" fill="none" stroke="#acd2e6" stroke-width="28" /><circle cx="100" cy="78" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="120" y="84.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">A</text><circle cx="280" cy="140" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="300" y="146.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">B</text><circle cx="420" cy="63" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="440" y="69.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">C</text><text x="25" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Illustrative locations; longitude goes first.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">You can inspect and share the geographic</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">context that later models need, using a few</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">visible lines of Python.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">What changes if you change zoom, and what</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">changes if you change longitude?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Spatial foundation: this notebook does not fit a learning model.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
