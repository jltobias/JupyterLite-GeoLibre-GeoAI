<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">Geography plus relationships</title><desc id="desc">Represent partnerships as graph edges with distance weights. Summarize each node&#x27;s degree, bridging role and connection distances. Group similar graph profiles and identify unusual combinations. Return scores to cities with known coordinates, keeping missing records visible in the table. Browser machine learning: graph features feed K-Means and Isolation Forest.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 10 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">Geography plus relationships</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">Which cities play similar roles in a partnership network?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Connect</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Represent partnerships as</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">graph edges with distance</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">weights.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Measure</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Summarize each node&#x27;s</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">degree, bridging role and</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">connection distances.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Learn</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Group similar graph</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">profiles and identify</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">unusual combinations.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Map</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Return scores to cities</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">with known coordinates,</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">keeping missing records</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">visible in the table.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M65 50 L170 50" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 50 L290 50" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M290 50 L440 50" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M65 50 L65 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 50 L170 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M290 50 L290 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M440 50 L440 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M65 155 L170 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M170 155 L290 155" fill="none" stroke="#90a8bf" stroke-width="4" /><path d="M290 155 L440 155" fill="none" stroke="#90a8bf" stroke-width="4" /><circle cx="65" cy="50" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="60" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">0</text><circle cx="170" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="165" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">1</text><circle cx="290" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="285" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">2</text><circle cx="440" cy="50" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="435" y="55.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">3</text><circle cx="65" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="60" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">4</text><circle cx="170" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="165" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">5</text><circle cx="290" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="285" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">6</text><circle cx="440" cy="155" r="14" fill="#2459b8" stroke="white" stroke-width="2"/><text x="435" y="160.0" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">7</text><text x="25" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Connections constrain paths (illustrative graph).</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Adding connections to locations lets you</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">explore patterns that a point map alone cannot</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">reveal.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Why can analysis include a city that the output</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">map omits?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Browser machine learning: graph features feed K-Means and Isolation Forest.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
