<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">The hexagon is a container</title><desc id="desc">Assign one location to a resolution-7 H3 cell. Convert the cell boundary to longitude-first GeoJSON. Finer resolution covers a smaller area; geometry is independent of population. Use population attributes as a separate source before calculating exposure or density. Spatial indexing foundation: H3 assigns cells; it does not estimate their populations.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 01 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">The hexagon is a container</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">How does changing spatial scale change what we can compare?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Locate</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Assign one location to a</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">resolution-7 H3 cell.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Outline</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Convert the cell boundary</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">to longitude-first GeoJSON.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Compare</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Finer resolution covers a</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">smaller area; geometry is</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">independent of population.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Join later</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use population attributes</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">as a separate source before</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">calculating exposure or</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">density.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M100.6 70.0 L66.0 90.0 L31.4 70.0 L31.4 30.0 L66.0 10.0 L100.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M172.6 70.0 L138.0 90.0 L103.4 70.0 L103.4 30.0 L138.0 10.0 L172.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M244.6 70.0 L210.0 90.0 L175.4 70.0 L175.4 30.0 L210.0 10.0 L244.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M316.6 70.0 L282.0 90.0 L247.4 70.0 L247.4 30.0 L282.0 10.0 L316.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M388.6 70.0 L354.0 90.0 L319.4 70.0 L319.4 30.0 L354.0 10.0 L388.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M460.6 70.0 L426.0 90.0 L391.4 70.0 L391.4 30.0 L426.0 10.0 L460.6 30.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M136.6 132.0 L102.0 152.0 L67.4 132.0 L67.4 92.0 L102.0 72.0 L136.6 92.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M208.6 132.0 L174.0 152.0 L139.4 132.0 L139.4 92.0 L174.0 72.0 L208.6 92.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M280.6 132.0 L246.0 152.0 L211.4 132.0 L211.4 92.0 L246.0 72.0 L280.6 92.0 Z" fill="#087f78" stroke="white" stroke-width="3" /><path d="M352.6 132.0 L318.0 152.0 L283.4 132.0 L283.4 92.0 L318.0 72.0 L352.6 92.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M424.6 132.0 L390.0 152.0 L355.4 132.0 L355.4 92.0 L390.0 72.0 L424.6 92.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M496.6 132.0 L462.0 152.0 L427.4 132.0 L427.4 92.0 L462.0 72.0 L496.6 92.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M100.6 194.0 L66.0 214.0 L31.4 194.0 L31.4 154.0 L66.0 134.0 L100.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M172.6 194.0 L138.0 214.0 L103.4 194.0 L103.4 154.0 L138.0 134.0 L172.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M244.6 194.0 L210.0 214.0 L175.4 194.0 L175.4 154.0 L210.0 134.0 L244.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M316.6 194.0 L282.0 214.0 L247.4 194.0 L247.4 154.0 L282.0 134.0 L316.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M388.6 194.0 L354.0 214.0 L319.4 194.0 L319.4 154.0 L354.0 134.0 L388.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><path d="M460.6 194.0 L426.0 214.0 L391.4 194.0 L391.4 154.0 L426.0 134.0 L460.6 154.0 Z" fill="#c6dbee" stroke="white" stroke-width="3" /><text x="25" y="233.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Same point, different spatial containers</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A common spatial index can connect population</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">with later model features while keeping scale</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">choices visible.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">If the same population is redistributed across</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">finer cells, must the total grow?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Spatial indexing foundation: H3 assigns cells; it does not estimate their populations.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
