<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">From a fire shape to a scene shortlist</title><desc id="desc">Describe historical fire area, perimeter, date and compactness. Flag unusual profiles, then choose a case using the explicit sorting rule. Search Sentinel-2 near the case in a bounded date window. Use an understandable preference rule and inspect the candidate over the fire. Mixed workflow: learned fire outliers and acquisition groups, plus a hand-set scene ranking rule.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 11 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">From a fire shape to a scene shortlist</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">Which satellite acquisitions should we inspect around a selected fire?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Measure</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Describe historical fire</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">area, perimeter, date and</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">compactness.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Select</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Flag unusual profiles, then</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">choose a case using the</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">explicit sorting rule.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Discover</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Search Sentinel-2 near the</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">case in a bounded date</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">window.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Rank</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use an understandable</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">preference rule and inspect</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">the candidate over the</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">fire.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M30 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M80 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M130 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M180 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M230 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M280 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M330 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M380 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M430 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M480 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 30 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 70 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 110 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 150 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 190 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M10 160 Q120 30 215 100 T530 70" fill="none" stroke="#acd2e6" stroke-width="28" /><circle cx="100" cy="78" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="120" y="84.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">A</text><circle cx="280" cy="140" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="300" y="146.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">B</text><circle cx="420" cy="63" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="440" y="69.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">C</text><text x="25" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Illustrative locations; longitude goes first.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">The workflow connects a large-data discovery</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">task to an inspectable case, reducing the</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">scenes a person needs to examine first.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Which part is a learned model and which part is</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">a chosen preference?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Mixed workflow: learned fire outliers and acquisition groups, plus a hand-set scene ranking rule.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
