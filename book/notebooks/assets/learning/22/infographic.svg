<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">One GeoAI result, two mapping tools</title><desc id="desc">Read 20 invented locations and their longitude/latitude coordinates. Group nearby locations, then test a different distance. Save GeoJSON and a provenance card before opening another app. Inspect the published example in RustGIS; import your export for changed results. DBSCAN learns groups from invented locations. Exporting GeoJSON and changing map projection do not train a model.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 22 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">One GeoAI result, two mapping tools</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">Can we inspect the same geographic groups in GeoLibre and RustGIS?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Inspect</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Read 20 invented locations</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">and their</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">longitude/latitude</text><text x="46" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">coordinates.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Fit</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Group nearby locations,</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">then test a different</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">distance.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Export</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Save GeoJSON and a</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">provenance card before</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">opening another app.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Compare</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Inspect the published</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">example in RustGIS; import</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">your export for changed</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">results.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M30 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M80 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M130 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M180 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M230 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M280 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M330 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M380 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M430 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M480 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 30 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 70 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 110 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 150 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 190 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M10 160 Q120 30 215 100 T530 70" fill="none" stroke="#acd2e6" stroke-width="28" /><circle cx="100" cy="78" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="120" y="84.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">A</text><circle cx="280" cy="140" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="300" y="146.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">B</text><circle cx="420" cy="63" r="14" fill="#087f78" stroke="white" stroke-width="2"/><text x="440" y="69.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14283f">C</text><text x="25" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Illustrative locations; longitude goes first.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Portable data and a method card let learners</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">compare tools without losing the meaning or</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">limits of an analysis.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Will the launch link show a radius you just</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">changed in the notebook?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">DBSCAN learns groups from invented locations. Exporting GeoJSON and changing map projection do not train a model.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
