"134" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="374" y="134" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="406" y="134" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="438" y="134" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="470" y="134" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="310" y="162" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="342" y="162" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="374" y="162" width="29" height="25" rx="2" fill="#087f78" stroke="none"/><rect x="406" y="162" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="438" y="162" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><rect x="470" y="162" width="29" height="25" rx="2" fill="#2459b8" stroke="none"/><text x="232" y="113.0" font-family="Arial, sans-serif" font-size="34" font-weight="400" fill="#2459b8">→</text><text x="28" y="222.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">pixels</text><text x="315" y="222.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">groups / changes</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">You can follow an entire</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">image-to-feature-to-model-to-map pipeline</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">without hiding the relationship between pixels</text><text x="615" y="625.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">and predictions.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Can cloud and built surfaces land in the same</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">bright cluster?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Browser machine learning: MiniBatch K-Means groups RGB appearance; no labeled land-cover model is trained.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
