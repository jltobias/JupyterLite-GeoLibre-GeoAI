<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">From county rows to patterns</title><desc id="desc">Use projected area to turn population counts into comparable densities. Log transforms and standardization reduce domination by feature units and large values. Group similar feature vectors; cluster numbers are category IDs. Compare maps, scatter and correlations before assigning meaning to groups. Browser machine learning: K-Means learns groups from engineered county features.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 02 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">From county rows to patterns</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">Which counties have similar density and housing profiles?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Measure</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Use projected area to turn</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">population counts into</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">comparable densities.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Scale</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Log transforms and</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">standardization reduce</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">domination by feature units</text><text x="359" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">and large values.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Learn</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Group similar feature</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">vectors; cluster numbers</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">are category IDs.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Check</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Compare maps, scatter and</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">correlations before</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">assigning meaning to</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">groups.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M45 15 V205 H515" fill="none" stroke="#45576c" stroke-width="2" /><circle cx="125.0" cy="167.0" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="150.5" cy="123.2" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="103.8" cy="166.1" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="117.2" cy="125.0" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="152.7" cy="163.6" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="109.8" cy="128.3" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="110.0" cy="159.5" r="7" fill="#2459b8" stroke="white" stroke-width="2"/><circle cx="270.0" cy="97.0" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="295.5" cy="53.2" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="248.8" cy="96.1" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="262.2" cy="55.0" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="297.7" cy="93.6" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="254.8" cy="58.3" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="255.0" cy="89.5" r="7" fill="#087f78" stroke="white" stroke-width="2"/><circle cx="420.0" cy="142.0" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="445.5" cy="98.2" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="398.8" cy="141.1" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="412.2" cy="100.0" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="447.7" cy="138.6" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="404.8" cy="103.3" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><circle cx="405.0" cy="134.5" r="7" fill="#7545b3" stroke="white" stroke-width="2"/><text x="25" y="235.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Schematic feature space; axes are not geography.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">A small browser model helps explore many</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">counties consistently, then returns group</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">membership to the map for inspection.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Why compare the feature scatter with the</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">geographic map?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Browser machine learning: K-Means learns groups from engineered county features.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
