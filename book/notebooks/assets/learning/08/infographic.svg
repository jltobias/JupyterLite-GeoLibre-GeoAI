<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc"><title id="title">A footprint is not its contents</title><desc id="desc">Bound the geographic question and the maximum returned sample. Put different providers&#x27; metadata into a common set of columns. Preserve unknown cloud values as missingness information before clustering. Map valid footprints and compare groups with provider counts and cloud metadata. Browser machine learning when enough items arrive: K-Means groups metadata, not image pixels.</desc><rect x="0" y="0" width="1280" height="900" rx="0" fill="#f5f7fa" stroke="none"/><rect x="0" y="0" width="1280" height="172" rx="0" fill="#14283f" stroke="none"/><text x="36" y="39.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a6dce1">BROWSER GEOAI / LAB 08 / VISUAL FIELD GUIDE</text><text x="36" y="90.0" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="white">A footprint is not its contents</text><text x="36" y="134.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#e1ebf5">Can we compare catalog items before downloading large imagery?</text><rect x="28" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="58" cy="232" r="17" fill="#2459b8" stroke="white" stroke-width="2"/><text x="52" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">1</text><text x="85" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2459b8">Search</text><text x="46" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Bound the geographic</text><text x="46" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">question and the maximum</text><text x="46" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">returned sample.</text><text x="320" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="341" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="371" cy="232" r="17" fill="#087f78" stroke="white" stroke-width="2"/><text x="365" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">2</text><text x="398" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#087f78">Normalize</text><text x="359" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Put different providers&#x27;</text><text x="359" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">metadata into a common set</text><text x="359" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">of columns.</text><text x="633" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="654" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="684" cy="232" r="17" fill="#7545b3" stroke="white" stroke-width="2"/><text x="678" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">3</text><text x="711" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#7545b3">Learn</text><text x="672" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Preserve unknown cloud</text><text x="672" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">values as missingness</text><text x="672" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">information before</text><text x="672" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">clustering.</text><text x="946" y="330.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#45576c">→</text><rect x="967" y="201" width="294" height="245" rx="16" fill="white" stroke="#d6e1ec"/><circle cx="997" cy="232" r="17" fill="#a96112" stroke="white" stroke-width="2"/><text x="991" y="238.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">4</text><text x="1024" y="239.0" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#a96112">Inspect</text><text x="985" y="278.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">Map valid footprints and</text><text x="985" y="305.6" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">compare groups with</text><text x="985" y="333.2" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">provider counts and cloud</text><text x="985" y="360.8" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#14283f">metadata.</text><text x="34" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">MAKE THE IDEA VISIBLE</text><g transform="translate(34 515)"><rect x="0" y="0" width="540" height="245" rx="16" fill="#f0f5fa" stroke="none"/><path d="M30 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M80 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M130 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M180 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M230 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M280 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M330 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M380 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M430 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M480 15 V210" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 30 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 70 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 110 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 150 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M20 190 H520" fill="none" stroke="#d3dfeb" stroke-width="1" /><path d="M10 160 Q120 30 215 100 T530 70" fill="none" stroke="#acd2e6" stroke-width="28" /><rect x="50" y="35" width="160" height="112" fill="#2459b8" fill-opacity=".12" stroke="#2459b8" stroke-width="3"/><rect x="160" y="80" width="160" height="112" fill="#087f78" fill-opacity=".12" stroke="#087f78" stroke-width="3"/><rect x="305" y="28" width="160" height="112" fill="#7545b3" fill-opacity=".12" stroke="#7545b3" stroke-width="3"/><text x="35" y="232.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#14283f">Boxes show coverage; pixels hold content.</text></g><text x="615" y="492.0" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087f78">WHAT THE BROWSER MAKES POSSIBLE</text><text x="615" y="532.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">Small metadata samples can reveal coverage and</text><text x="615" y="563.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">missingness and help choose what to inspect</text><text x="615" y="594.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14283f">next.</text><text x="615" y="679.0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#a96112">READ THE CODE, THEN CHECK THE CLAIM</text><text x="615" y="713.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">Is an imputed cloud value an observed</text><text x="615" y="741.4" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14283f">measurement?</text><rect x="28" y="794" width="1224" height="80" rx="16" fill="#e7eef5" stroke="none"/><text x="46" y="821.0" font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#14283f">Browser machine learning when enough items arrive: K-Means groups metadata, not image pixels.</text><text x="46" y="889.0" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#45576c">Original teaching illustration • schematic marks, not measured data or a model output</text></svg>
