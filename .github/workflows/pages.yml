name: Deploy Jupyter Book and JupyterLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install site builders
        run: python -m pip install -r requirements.txt

      - name: Validate JupyterLite GeoLibre compatibility
        run: |
          python -m py_compile book/notebooks/geolibre_lite.py
          if grep -R -n 'from geolibre import Map' book/notebooks/*.ipynb; then
            echo 'Do not instantiate upstream geolibre.Map in standalone JupyterLite; use geolibre_lite.LiteMap.'
            exit 1
          fi

      - name: Build JupyterLite
        run: |
          rm -rf site book/_build
          jupyter lite build --contents book/notebooks --output-dir site/lite

      - name: Build Jupyter Book
        run: |
          jupyter-book build book
          cp -a book/_build/html/. site/
          touch site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
